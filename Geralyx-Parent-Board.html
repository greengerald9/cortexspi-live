<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Geralyx · Your Athlete</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F2F0EC; min-height: 100vh; padding-bottom: 32px; }

  .header { background: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e5e0; position: sticky; top: 0; z-index: 10; }
  .wordmark { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #1a1a1a; }
  .wordmark span { color: #E8B84B; }
  .live-pill { display: flex; align-items: center; gap: 5px; background: #edfbf3; border: 1px solid #a8e6c4; border-radius: 20px; padding: 4px 10px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #2E7D5B; animation: pulse 2s infinite; }
  .live-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #2E7D5B; text-transform: uppercase; letter-spacing: 0.1em; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* HERO */
  .hero { padding: 24px 20px 16px; background: #fff; border-bottom: 1px solid #e8e5e0; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .hero-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 4px; }
  .hero-id { font-family: 'Oswald', sans-serif; font-size: 48px; font-weight: 700; line-height: 1; }
  .hero-id.F { color: #5FA8C9; }
  .hero-id.D { color: #2E7D5B; }
  .hero-id.P { color: #E8B84B; }
  .hero-programme { font-size: 12px; color: #888; margin-top: 4px; }
  .tier-pill { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; padding: 4px 12px; border-radius: 20px; align-self: flex-start; margin-top: 4px; }
  .tier-pill.F { background: rgba(95,168,201,0.1); border: 1px solid rgba(95,168,201,0.3); color: #5FA8C9; }
  .tier-pill.D { background: rgba(46,125,91,0.1); border: 1px solid rgba(46,125,91,0.3); color: #2E7D5B; }
  .tier-pill.P { background: rgba(232,184,75,0.1); border: 1px solid rgba(232,184,75,0.3); color: #E8B84B; }

  /* OVERALL */
  .overall-card { margin: 16px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
  .ov-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 6px; }
  .ov-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .ov-pct { font-family: 'Oswald', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; }
  .ov-pct.pos { color: #2E7D5B; }
  .ov-pct.neg { color: #E8543A; }
  .ov-pct.nil { color: #aaa; }
  .ov-sub { font-size: 12px; color: #aaa; margin-top: 6px; }
  .best-block { text-align: right; }
  .best-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #bbb; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .best-badge { background: #FFF8E8; border: 1px solid #E8B84B; border-radius: 10px; padding: 8px 12px; }
  .best-name { font-size: 11px; font-weight: 600; color: #1a1a1a; }
  .best-pct { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: #E8B84B; }

  /* CHART */
  .chart-card { margin: 0 16px 16px; background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
  .chart-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 14px; }
  .chart-wrap { display: flex; flex-direction: column; gap: 10px; }
  .chart-row { display: flex; align-items: center; gap: 10px; }
  .chart-label { font-size: 11px; color: #555; font-weight: 500; width: 80px; flex-shrink: 0; line-height: 1.3; }
  .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .chart-bar-track { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
  .chart-bar-fill.pos { background: linear-gradient(90deg, #2E7D5B, #39E07A); }
  .chart-bar-fill.neg { background: linear-gradient(90deg, #E8543A, #ff7a5a); }
  .chart-bar-fill.nil { background: #E8B84B; width: 4px !important; }
  .chart-val { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; width: 46px; text-align: right; flex-shrink: 0; }
  .chart-val.pos { color: #2E7D5B; }
  .chart-val.neg { color: #E8543A; }
  .chart-val.nil { color: #E8B84B; }

  /* STATION LIST */
  .section-label { padding: 4px 16px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.2em; }
  .stations { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .stn-card { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); display: flex; align-items: center; gap: 12px; }
  .stn-card.pos { border-left: 3px solid #2E7D5B; }
  .stn-card.neg { border-left: 3px solid #E8543A; }
  .stn-card.nil { border-left: 3px solid #E8B84B; }
  .stn-card.empty { border-left: 3px solid #e5e5e5; opacity: 0.5; }
  .stn-emoji-sm { font-size: 20px; flex-shrink: 0; }
  .stn-info { flex: 1; }
  .stn-name { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .stn-msg { font-size: 11px; margin-top: 2px; }
  .stn-msg.pos { color: #2E7D5B; }
  .stn-msg.neg { color: #E8543A; }
  .stn-msg.nil { color: #888; }
  .stn-right { text-align: right; flex-shrink: 0; }
  .stn-score-val { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: #1a1a1a; line-height: 1; }
  .stn-unit { font-size: 10px; color: #aaa; }
  .stn-delta { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; margin-top: 2px; }
  .stn-delta.pos { color: #2E7D5B; }
  .stn-delta.neg { color: #E8543A; }
  .stn-delta.nil { color: #E8B84B; }

  /* BASELINE */
  .baseline-card { margin: 16px; background: #EDF7F1; border: 1px solid #a8e6c4; border-radius: 16px; padding: 24px 20px; text-align: center; }
  .baseline-emoji { font-size: 36px; margin-bottom: 10px; }
  .baseline-title { font-family: 'Oswald', sans-serif; font-size: 22px; text-transform: uppercase; color: #0F1E18; margin-bottom: 8px; }
  .baseline-sub { font-size: 13px; color: #555; line-height: 1.7; }

  .footer { padding: 20px; text-align: center; }
  .footer-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #ccc; text-transform: uppercase; letter-spacing: 0.1em; }
</style>
</head>
<body>

<div class="header">
  <div class="wordmark">GERAL<span>Y</span>X</div>
  <div class="live-pill"><div class="live-dot"></div><span class="live-text">Live</span></div>
</div>

<div id="content">
  <div style="padding:60px 20px;text-align:center;color:#aaa;font-size:13px;">Loading your athlete...</div>
</div>

<div class="footer">
  <div class="footer-text">Geralyx · Individual Athlete Development & Intelligence · Private</div>
</div>

<script>
const SHEET_ID = '19Ea_YOGRlh97lElsDbj6hDGgS-FSSDpvXErlYGYdvk0';

const TIER_DATA = {
  F: {
    name: 'Foundation',
    programme: 'Individual Athlete Development & Intelligence',
    stations: [
      { name:'Sit-to-Stand', emoji:'🪑', unit:'reps / 1 min' },
      { name:'Wall Push-Up', emoji:'🤲', unit:'max reps' },
      { name:'Side Plank', emoji:'🧘', unit:'seconds' },
      { name:'Balance Walk', emoji:'👣', unit:'score /3' },
      { name:'Farmer Carry', emoji:'💼', unit:'metres' },
      { name:'Med Ball Throw', emoji:'🏐', unit:'metres' },
      { name:'Step-Up', emoji:'🪜', unit:'reps / 1 min' },
      { name:'Bike Sprint', emoji:'🚴', unit:'cal / 30s' },
      null, null
    ],
    msgs: {
      pos: ['↑ Better than last time','↑ Improving well','↑ Great progress'],
      neg: ['↓ One to work on','↓ Focus here next session'],
      nil: ['→ Holding steady','→ Same as last time']
    }
  },
  D: {
    name: 'Developmental',
    programme: 'Individual Athlete Development & Intelligence',
    stations: [
      { name:'20m Sprint', emoji:'⚡', unit:'seconds' },
      { name:'Resisted Broad Jump', emoji:'🦘', unit:'metres' },
      { name:'AirBike Sprint', emoji:'🚴', unit:'calories' },
      { name:'T-Test', emoji:'📐', unit:'seconds' },
      { name:'Loaded CMJ', emoji:'🏋️', unit:'cm' },
      { name:'Pull-Up', emoji:'💪', unit:'max reps' },
      { name:'Rotational Med Ball', emoji:'🔄', unit:'metres' },
      { name:'Pallof Hold', emoji:'🧘', unit:'seconds' },
      { name:'Reactive Catch', emoji:'⚡', unit:'score /10' },
      { name:'Drop Jump', emoji:'🎯', unit:'score /3' }
    ],
    msgs: {
      pos: ['↑ Improving','↑ Strong progress','↑ Better than last time'],
      neg: ['↓ Area to focus on','↓ Work in progress'],
      nil: ['→ Holding steady']
    }
  },
  P: {
    name: 'Performance',
    programme: 'Individual Athlete Development & Intelligence',
    stations: [
      { name:'Sprint 20m', emoji:'⚡', unit:'seconds' },
      { name:'Force Plate CMJ', emoji:'📊', unit:'cm' },
      { name:'Rowing Erg', emoji:'🚣', unit:'W/kg' },
      { name:'Ski Erg', emoji:'🎿', unit:'W/kg' },
      { name:'Sled Sprint', emoji:'🏋️', unit:'seconds' },
      { name:'T-Test Gates', emoji:'📐', unit:'seconds' },
      { name:'RAST', emoji:'🏃', unit:'fatigue %' },
      { name:'Rotational Med Ball', emoji:'🔄', unit:'metres' },
      { name:'Pallof Load', emoji:'🧘', unit:'kg' },
      { name:'Drop Jump RSI', emoji:'🎯', unit:'RSI' }
    ],
    msgs: {
      pos: ['↑ Improvement recorded','↑ Progressing well'],
      neg: ['↓ Under review','↓ Focus area'],
      nil: ['→ Holding steady']
    }
  }
};

function getTier(id) { const f=String(id)[0]; return f==='2'?'D':f==='3'?'P':'F'; }
function getParam() { return new URLSearchParams(window.location.search).get('athlete'); }
function fmt(v) { if(v===null||isNaN(v))return'—'; return(v>=0?'+':'')+v.toFixed(1)+'%'; }
function parseVal(cell) { if(!cell||cell.v===null||cell.v===undefined)return null; const s=String(cell.v); if(s==='—'||s==='')return null; const n=parseFloat(s.replace(/[^0-9.-]/g,'')); return isNaN(n)?null:n; }
function parsePct(cell) { if(!cell)return null; const raw=cell.f||(cell.v!==null?String(cell.v):''); const clean=raw.replace(/[%+\s—]/g,''); if(!clean)return null; const n=parseFloat(clean); return isNaN(n)?null:n; }
function rnd(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

async function load() {
  const athleteId = getParam();
  if (!athleteId) {
    document.getElementById('content').innerHTML = '<div style="padding:60px 20px;text-align:center;color:#aaa;font-size:13px;">No athlete ID.<br>Add ?athlete=101 to your link.</div>';
    return;
  }

  const tier = getTier(athleteId);
  const td = TIER_DATA[tier];

  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Board&headers=1`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(')+1, text.lastIndexOf(')')));
    const rows = json.table.rows;

    let targetRow = null;
    for (const row of rows) {
      const cells = row.c||[];
      if(!cells[1]||cells[1].v===null)continue;
      const id = String(cells[1].v).replace('.0','').trim();
      if(id===String(athleteId)){targetRow=cells;break;}
    }

    if(!targetRow){
      document.getElementById('content').innerHTML='<div style="padding:60px 20px;text-align:center;color:#aaa;font-size:13px;">Athlete not found.<br>Check your link.</div>';
      return;
    }

    const wk1=[],wk2=[],deltas=[];
    for(let i=0;i<10;i++){
      wk1.push(parseVal(targetRow[2+i*3]));
      wk2.push(parseVal(targetRow[3+i*3]));
      deltas.push(parsePct(targetRow[4+i*3]));
    }

    const overall = parsePct(targetRow[32]);
    const hasComparison = overall!==null&&wk2.some(v=>v!==null);
    const hasBaseline = wk1.some(v=>v!==null);

    let bestIdx=-1,bestVal=-Infinity;
    deltas.forEach((d,i)=>{if(d!==null&&d>bestVal){bestVal=d;bestIdx=i;}});

    const maxAbs = Math.max(...deltas.filter(d=>d!==null).map(d=>Math.abs(d)),1);

    let html = `
      <div class="hero">
        <div class="hero-top">
          <div>
            <div class="hero-label">Athlete</div>
            <div class="hero-id ${tier}">${athleteId}</div>
            <div class="hero-programme">${td.programme}</div>
          </div>
          <div class="tier-pill ${tier}">${td.name}</div>
        </div>
      </div>`;

    if (hasComparison) {
      const ovCls = overall>0?'pos':overall<0?'neg':'nil';
      html += `
        <div class="overall-card">
          <div class="ov-label">Overall — vs last time</div>
          <div class="ov-row">
            <div>
              <div class="ov-pct ${ovCls}">${fmt(overall)}</div>
              <div class="ov-sub">across all stations</div>
            </div>
            ${bestIdx>=0?`
            <div class="best-block">
              <div class="best-label">Best station</div>
              <div class="best-badge">
                <div class="best-name">${td.stations[bestIdx]?.name||''}</div>
                <div class="best-pct">${fmt(bestVal)}</div>
              </div>
            </div>`:''}
          </div>
        </div>`;

      // BAR CHART
      html += `
        <div class="chart-card">
          <div class="chart-title">Improvement % — vs last time</div>
          <div class="chart-wrap">`;

      const activeStations = td.stations.filter(s=>s!==null);
      activeStations.forEach((s,i)=>{
        const d = deltas[i];
        const cls = d===null?'nil':d>0?'pos':'neg';
        const barW = d===null?0:Math.abs(d)/maxAbs*100;
        html+=`
          <div class="chart-row">
            <div class="chart-label">${s.emoji} ${s.name}</div>
            <div class="chart-bar-wrap">
              <div class="chart-bar-track">
                <div class="chart-bar-fill ${cls}" style="width:${d!==null?barW:0}%"></div>
              </div>
            </div>
            <div class="chart-val ${cls}">${fmt(d)}</div>
          </div>`;
      });

      html+=`</div></div>`;

      // STATION LIST
      html+=`<div class="section-label">Station breakdown</div><div class="stations">`;
      for(let i=0;i<td.stations.length;i++){
        const s=td.stations[i];
        if(!s)continue;
        const score=wk2[i]!==null?wk2[i]:wk1[i];
        const delta=deltas[i];
        const cls=delta===null?'empty':delta>0?'pos':delta<0?'neg':'nil';
        const msgArr=delta===null?['—']:delta>0?td.msgs.pos:delta<0?td.msgs.neg:td.msgs.nil;
        html+=`
          <div class="stn-card ${cls}">
            <span class="stn-emoji-sm">${s.emoji}</span>
            <div class="stn-info">
              <div class="stn-name">${s.name}</div>
              <div class="stn-msg ${cls}">${rnd(msgArr)}</div>
            </div>
            <div class="stn-right">
              <div class="stn-score-val">${score!==null?score:'—'}</div>
              <div class="stn-unit">${score!==null?s.unit:''}</div>
              ${delta!==null?`<div class="stn-delta ${cls}">${fmt(delta)}</div>`:''}
            </div>
          </div>`;
      }
      html+=`</div>`;

    } else if (hasBaseline) {
      html+=`
        <div class="baseline-card">
          <div class="baseline-emoji">✅</div>
          <div class="baseline-title">Week 1 Complete</div>
          <div class="baseline-sub">Baseline scores are recorded and locked in. Check back after the next session to see improvements across every station.</div>
        </div>
        <div class="section-label">Week 1 baseline</div>
        <div class="stations">`;
      for(let i=0;i<td.stations.length;i++){
        const s=td.stations[i];
        if(!s)continue;
        html+=`
          <div class="stn-card nil">
            <span class="stn-emoji-sm">${s.emoji}</span>
            <div class="stn-info"><div class="stn-name">${s.name}</div><div class="stn-msg nil">Baseline set</div></div>
            <div class="stn-right">
              <div class="stn-score-val">${wk1[i]!==null?wk1[i]:'—'}</div>
              <div class="stn-unit">${wk1[i]!==null?s.unit:''}</div>
            </div>
          </div>`;
      }
      html+=`</div>`;
    } else {
      html+=`
        <div class="baseline-card">
          <div class="baseline-emoji">🏃</div>
          <div class="baseline-title">Session incoming</div>
          <div class="baseline-sub">Scores will appear here after the first session. The journey starts soon.</div>
        </div>`;
    }

    document.getElementById('content').innerHTML=html;

  } catch(e) {
    console.error(e);
    document.getElementById('content').innerHTML='<div style="padding:60px 20px;text-align:center;color:#aaa;">Connection error — retrying in 30 seconds</div>';
  }
}

load();
setInterval(load,30000);
</script>
</body>
</html>
