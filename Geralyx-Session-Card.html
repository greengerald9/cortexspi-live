<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geralyx · Live Session</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #080F0B; color: #EFEDE5; min-height: 100vh; display: flex; flex-direction: column; }

  .header { background: #0A1210; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(239,237,229,0.06); }
  .wordmark { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #EFEDE5; }
  .wordmark span { color: #E8B84B; }
  .live-pill { display: flex; align-items: center; gap: 6px; background: rgba(46,125,91,0.12); border: 1px solid rgba(46,125,91,0.25); border-radius: 20px; padding: 4px 12px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #2E7D5B; animation: pulse 2s infinite; }
  .live-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #2E7D5B; text-transform: uppercase; letter-spacing: 0.1em; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .athlete-strip { background: #0F1E18; padding: 14px 20px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid rgba(232,184,75,0.15); }
  .athlete-block { display: flex; flex-direction: column; }
  .a-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.4); text-transform: uppercase; letter-spacing: 0.2em; }
  .a-val { font-family: 'Oswald', sans-serif; font-size: 36px; font-weight: 700; color: #E8B84B; line-height: 1; }
  .a-val.small { font-size: 20px; color: #EFEDE5; }
  .strip-div { width: 1px; height: 40px; background: rgba(239,237,229,0.06); }
  .tier-badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; padding: 3px 10px; border-radius: 20px; }
  .tier-badge.F { background: rgba(95,168,201,0.12); border: 1px solid rgba(95,168,201,0.25); color: #5FA8C9; }
  .tier-badge.D { background: rgba(46,125,91,0.12); border: 1px solid rgba(46,125,91,0.25); color: #2E7D5B; }
  .tier-badge.P { background: rgba(232,184,75,0.12); border: 1px solid rgba(232,184,75,0.25); color: #E8B84B; }
  .vs-pill { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(239,237,229,0.4); background: rgba(239,237,229,0.04); border: 1px solid rgba(239,237,229,0.08); border-radius: 20px; padding: 4px 12px; }

  .grid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); gap: 2px; background: rgba(239,237,229,0.03); padding: 2px; }

  .stn-box { background: #0A1210; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px; }
  .stn-box.filled { background: #0D1F14; }
  .stn-box.best { background: #0D1F14; border: 1px solid rgba(232,184,75,0.2); }
  .stn-box.empty-slot { opacity: 0.3; }

  .stn-top { display: flex; justify-content: space-between; align-items: center; }
  .stn-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #E8B84B; }
  .stn-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(239,237,229,0.08); }
  .stn-dot.filled { background: #2E7D5B; }
  .stn-dot.best { background: #E8B84B; }

  .stn-name { font-size: 12px; font-weight: 500; color: rgba(239,237,229,0.65); line-height: 1.3; }
  .stn-score { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; color: #EFEDE5; line-height: 1; margin-top: 4px; }
  .stn-score.empty { color: rgba(239,237,229,0.08); font-size: 24px; }
  .stn-unit { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.3); }
  .stn-vs { font-size: 11px; font-weight: 600; margin-top: 2px; }
  .stn-vs.pos { color: #2E7D5B; }
  .stn-vs.neg { color: #E8543A; }
  .stn-vs.nil { color: rgba(239,237,229,0.25); }

  .footer { background: #0A1210; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(239,237,229,0.06); }
  .overall-block { display: flex; align-items: baseline; gap: 8px; }
  .overall-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.35); text-transform: uppercase; letter-spacing: 0.1em; }
  .overall-val { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; }
  .overall-val.pos { color: #2E7D5B; }
  .overall-val.neg { color: #E8543A; }
  .overall-val.nil { color: rgba(239,237,229,0.3); }
  .footer-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.15); }
</style>
</head>
<body>

<div class="header">
  <div class="wordmark">GERAL<span>Y</span>X</div>
  <div class="live-pill"><div class="live-dot"></div><span class="live-text">Live</span></div>
</div>

<div class="athlete-strip">
  <div class="athlete-block">
    <div class="a-label">Athlete</div>
    <div class="a-val" id="athlete-id">—</div>
  </div>
  <div class="strip-div"></div>
  <div class="athlete-block">
    <div class="a-label">Circuit</div>
    <div class="a-val small" id="circuit-name">—</div>
  </div>
  <div class="strip-div"></div>
  <div class="athlete-block">
    <div class="a-label">Week</div>
    <div class="a-val small" id="week-num">—</div>
  </div>
  <div class="tier-badge" id="tier-badge">—</div>
  <div class="vs-pill" id="vs-pill">vs last time</div>
</div>

<div class="grid" id="station-grid"></div>

<div class="footer">
  <div class="overall-block">
    <span class="overall-label">vs last time</span>
    <span class="overall-val" id="overall-val">—</span>
  </div>
  <span class="footer-time" id="footer-time"></span>
</div>

<script>
const SHEET_ID = '19Ea_YOGRlh97lElsDbj6hDGgS-FSSDpvXErlYGYdvk0';

const STATIONS = {
  F: [
    {name:'Sit-to-Stand', unit:'reps / 30s'},
    {name:'Wall Push-Up', unit:'max reps'},
    {name:'Side Plank', unit:'seconds'},
    {name:'Balance Walk', unit:'score /3'},
    {name:'Farmer Carry', unit:'lengths'},
    {name:'Med Ball Throw', unit:'metres'},
    {name:'Step-Up', unit:'reps / 30s'},
    {name:'Bike Sprint', unit:'cal / 30s'},
    {name:'', unit:''},
    {name:'', unit:''}
  ],
  D: [
    {name:'20m Sprint', unit:'seconds'},
    {name:'Resisted Broad Jump', unit:'metres'},
    {name:'AirBike Sprint', unit:'calories'},
    {name:'T-Test', unit:'seconds'},
    {name:'Loaded CMJ', unit:'cm'},
    {name:'Pull-Up', unit:'max reps'},
    {name:'Rotational Med Ball', unit:'metres'},
    {name:'Pallof Hold', unit:'seconds'},
    {name:'Reactive Catch', unit:'score /10'},
    {name:'Drop Jump', unit:'score /3'}
  ],
  P: [
    {name:'Sprint 20m', unit:'seconds'},
    {name:'Force Plate CMJ', unit:'cm'},
    {name:'Rowing Erg', unit:'W/kg'},
    {name:'Ski Erg', unit:'W/kg'},
    {name:'Sled Sprint', unit:'seconds'},
    {name:'T-Test Gates', unit:'seconds'},
    {name:'RAST', unit:'fatigue %'},
    {name:'Rotational Med Ball', unit:'metres'},
    {name:'Pallof Load', unit:'kg'},
    {name:'Drop Jump RSI', unit:'RSI'}
  ]
};

function getTier(id) {
  const first = String(id)[0];
  if (first === '1') return 'F';
  if (first === '2') return 'D';
  if (first === '3') return 'P';
  return 'F';
}

function getTierName(t) {
  if (t === 'F') return 'Foundation';
  if (t === 'D') return 'Developmental';
  return 'Performance';
}

function getParam() {
  return new URLSearchParams(window.location.search).get('athlete');
}

function fmt(v) {
  if (v === null || isNaN(v)) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
}

function parseVal(cell) {
  if (!cell || cell.v === null || cell.v === undefined) return null;
  const s = String(cell.v);
  if (s === '—' || s === '') return null;
  const n = parseFloat(s.replace(/[^0-9.-]/g, ''));
  return isNaN(n) ? null : n;
}

function parsePct(cell) {
  if (!cell) return null;
  const raw = cell.f || (cell.v !== null ? String(cell.v) : '');
  const clean = raw.replace(/[%+\s—]/g, '');
  if (!clean) return null;
  const n = parseFloat(clean);
  return isNaN(n) ? null : n;
}

async function load() {
  const athleteId = getParam();
  if (!athleteId) {
    document.getElementById('station-grid').innerHTML = '<div style="color:rgba(239,237,229,0.3);padding:40px;grid-column:1/-1;text-align:center;font-family:JetBrains Mono,monospace;font-size:12px;">Add ?athlete=101 to the URL</div>';
    return;
  }

  const tier = getTier(athleteId);
  const stations = STATIONS[tier];
  const tierName = getTierName(tier);

  document.getElementById('athlete-id').textContent = athleteId;
  document.getElementById('circuit-name').textContent = tierName;
  document.getElementById('tier-badge').textContent = tierName;
  document.getElementById('tier-badge').className = 'tier-badge ' + tier;

  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Board&headers=1`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
    const rows = json.table.rows;

    let targetRow = null;
    for (const row of rows) {
      const cells = row.c || [];
      if (!cells[0] || cells[0].v === null) continue;
      const id = String(cells[0].v).replace('.0','').trim();
      if (id === String(athleteId)) { targetRow = cells; break; }
    }

    if (!targetRow) {
      document.getElementById('station-grid').innerHTML = '<div style="color:rgba(239,237,229,0.3);padding:40px;grid-column:1/-1;text-align:center;">Athlete not found in Board</div>';
      return;
    }

    const wk1 = [], wk2 = [], deltas = [];
    for (let i = 0; i < 10; i++) {
      wk1.push(parseVal(targetRow[1 + i * 3]));
      wk2.push(parseVal(targetRow[2 + i * 3]));
      deltas.push(parsePct(targetRow[3 + i * 3]));
    }

    const overall = parsePct(targetRow[31]);
    const week = wk2.some(v => v !== null) ? '2+' : '1';
    document.getElementById('week-num').textContent = 'Week ' + week;

    let bestIdx = -1, bestVal = -Infinity;
    deltas.forEach((d, i) => { if (d !== null && d > bestVal) { bestVal = d; bestIdx = i; } });

    let grid = '';
    for (let i = 0; i < 10; i++) {
      const s = stations[i];
      if (!s.name) { grid += `<div class="stn-box empty-slot"></div>`; continue; }
      const score = wk2[i] !== null ? wk2[i] : wk1[i];
      const delta = deltas[i];
      const isBest = i === bestIdx && bestVal > 0;
      const hasSc = score !== null;
      const cls = hasSc ? (isBest ? 'best' : 'filled') : '';
      const dotCls = hasSc ? (isBest ? 'best' : 'filled') : '';
      const vsCls = delta === null ? 'nil' : delta > 0 ? 'pos' : 'neg';
      const vsText = delta !== null ? fmt(delta) + ' vs last time' : '—';

      grid += `
        <div class="stn-box ${cls}">
          <div class="stn-top"><span class="stn-num">S${i+1}</span><div class="stn-dot ${dotCls}"></div></div>
          <div class="stn-name">${s.name}</div>
          <div class="stn-score ${hasSc ? '' : 'empty'}">${hasSc ? score : '—'}</div>
          <div class="stn-unit">${hasSc ? s.unit : ''}</div>
          ${delta !== null ? `<div class="stn-vs ${vsCls}">${vsText}</div>` : ''}
        </div>`;
    }

    document.getElementById('station-grid').innerHTML = grid;

    const ov = overall;
    const ovEl = document.getElementById('overall-val');
    if (ov !== null) {
      ovEl.textContent = fmt(ov);
      ovEl.className = 'overall-val ' + (ov > 0 ? 'pos' : ov < 0 ? 'neg' : 'nil');
    } else {
      ovEl.textContent = '—';
      ovEl.className = 'overall-val nil';
    }

    document.getElementById('footer-time').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

  } catch(e) {
    console.error(e);
    document.getElementById('station-grid').innerHTML = '<div style="color:rgba(239,237,229,0.3);padding:40px;grid-column:1/-1;text-align:center;">Connection error — retrying</div>';
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
