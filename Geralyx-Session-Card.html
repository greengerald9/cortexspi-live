!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geralyx · Live Session</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(135deg, #0A1F10 0%, #071209 50%, #050D08 100%);
    color: #EFEDE5;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient glow */
  body::before {
    content: '';
    position: fixed;
    top: -100px; left: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(46,125,91,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; right: -100px;
    width: 350px; height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,184,75,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  /* HEADER */
  .header {
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(57,224,122,0.1);
    background: rgba(5,13,8,0.6);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 10;
  }
  .wordmark { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #EFEDE5; }
  .wordmark span { color: #E8B84B; }
  .live-pill { display: flex; align-items: center; gap: 6px; background: rgba(57,224,122,0.1); border: 1px solid rgba(57,224,122,0.25); border-radius: 20px; padding: 4px 12px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #39E07A; animation: pulse 1.5s infinite; }
  .live-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #39E07A; text-transform: uppercase; letter-spacing: 0.15em; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

  /* ATHLETE STRIP */
  .athlete-strip {
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid rgba(57,224,122,0.08);
    background: rgba(10,31,16,0.4);
  }
  .a-block { display: flex; flex-direction: column; }
  .a-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.35); text-transform: uppercase; letter-spacing: 0.2em; }
  .a-val { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; color: #E8B84B; line-height: 1; }
  .a-val.sm { font-size: 18px; color: #EFEDE5; }
  .strip-div { width: 1px; height: 36px; background: rgba(239,237,229,0.06); }
  .programme-name { font-size: 11px; color: rgba(239,237,229,0.4); margin-left: auto; text-align: right; font-style: italic; }

  /* INTENSITY WAVE */
  .wave-bar {
    padding: 8px 20px;
    display: flex;
    gap: 4px;
    align-items: flex-end;
    border-bottom: 1px solid rgba(57,224,122,0.06);
  }
  .wave-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.3); text-transform: uppercase; letter-spacing: 0.1em; margin-right: 6px; align-self: center; }
  .wave-seg { border-radius: 2px; flex: 1; transition: height 0.3s; }

  /* STATION GRID */
  .grid { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px 14px; }

  .stn-box {
    background: rgba(15,35,20,0.7);
    border: 1px solid rgba(57,224,122,0.08);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .stn-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 14px 14px 0 0;
    background: transparent;
    transition: background 0.3s;
  }
  .stn-box.filled { background: rgba(20,50,28,0.8); border-color: rgba(57,224,122,0.2); }
  .stn-box.filled::before { background: linear-gradient(90deg, #39E07A, transparent); }
  .stn-box.best { background: rgba(30,55,20,0.9); border-color: rgba(232,184,75,0.35); }
  .stn-box.best::before { background: linear-gradient(90deg, #E8B84B, transparent); }

  .stn-top { display: flex; justify-content: space-between; align-items: center; }
  .stn-emoji { font-size: 22px; line-height: 1; }
  .stn-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(239,237,229,0.3); }
  .stn-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(239,237,229,0.08); transition: all 0.3s; }
  .stn-dot.filled { background: #39E07A; box-shadow: 0 0 6px rgba(57,224,122,0.5); }
  .stn-dot.best { background: #E8B84B; box-shadow: 0 0 6px rgba(232,184,75,0.5); }

  .stn-name { font-size: 13px; font-weight: 600; color: #EFEDE5; line-height: 1.2; }
  .stn-metric { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.35); text-transform: uppercase; letter-spacing: 0.1em; }

  .stn-score { font-family: 'Oswald', sans-serif; font-size: 34px; font-weight: 700; color: #EFEDE5; line-height: 1; margin-top: 4px; }
  .stn-score.empty { color: rgba(239,237,229,0.08); font-size: 26px; }
  .stn-unit { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.3); }

  .stn-vs { font-size: 11px; font-weight: 600; }
  .stn-vs.pos { color: #39E07A; }
  .stn-vs.neg { color: #E8543A; }
  .stn-vs.nil { color: rgba(239,237,229,0.2); }

  .stn-cue { font-size: 10px; color: rgba(239,237,229,0.4); font-style: italic; margin-top: 2px; line-height: 1.4; }
  .stn-prompt { font-size: 10px; color: #39E07A; font-weight: 500; margin-top: 2px; }

  /* FOOTER */
  .footer {
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(57,224,122,0.08);
    background: rgba(5,13,8,0.6);
    backdrop-filter: blur(10px);
  }
  .overall-block { display: flex; align-items: baseline; gap: 8px; }
  .overall-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.3); text-transform: uppercase; letter-spacing: 0.1em; }
  .overall-val { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; }
  .overall-val.pos { color: #39E07A; }
  .overall-val.neg { color: #E8543A; }
  .overall-val.nil { color: rgba(239,237,229,0.25); }
  .footer-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(239,237,229,0.15); }
</style>
</head>
<body>

<div class="header">
  <div class="wordmark">GERAL<span>Y</span>X</div>
  <div class="live-pill"><div class="live-dot"></div><span class="live-text">Live</span></div>
</div>

<div class="athlete-strip">
  <div class="a-block">
    <div class="a-label">Athlete</div>
    <div class="a-val" id="athlete-id">—</div>
  </div>
  <div class="strip-div"></div>
  <div class="a-block">
    <div class="a-label">Week</div>
    <div class="a-val sm" id="week-num">—</div>
  </div>
  <div class="strip-div"></div>
  <div class="a-block">
    <div class="a-label">Tier</div>
    <div class="a-val sm" id="tier-name">—</div>
  </div>
  <div class="programme-name">Individual Athlete<br>Development & Intelligence</div>
</div>

<!-- INTENSITY WAVE -->
<div class="wave-bar">
  <span class="wave-label">Intensity</span>
  <div class="wave-seg" style="height:18px;background:rgba(57,224,122,0.3)"></div>
  <div class="wave-seg" style="height:24px;background:rgba(57,224,122,0.4)"></div>
  <div class="wave-seg" style="height:16px;background:rgba(57,224,122,0.25)"></div>
  <div class="wave-seg" style="height:28px;background:rgba(57,224,122,0.5)"></div>
  <div class="wave-seg" style="height:20px;background:rgba(57,224,122,0.35)"></div>
  <div class="wave-seg" style="height:32px;background:rgba(232,184,75,0.5)"></div>
  <div class="wave-seg" style="height:22px;background:rgba(57,224,122,0.4)"></div>
  <div class="wave-seg" style="height:36px;background:rgba(232,184,75,0.6)"></div>
</div>

<div class="grid" id="station-grid"></div>

<div class="footer">
  <div class="overall-block">
    <span class="overall-label">vs last time</span>
    <span class="overall-val nil" id="overall-val">—</span>
  </div>
  <span class="footer-time" id="footer-time"></span>
</div>

<script>
const SHEET_ID = '19Ea_YOGRlh97lElsDbj6hDGgS-FSSDpvXErlYGYdvk0';

const TIER_DATA = {
  F: {
    name: 'Foundation',
    stations: [
      { name:'Sit-to-Stand', emoji:'🪑', unit:'reps / 1 min', metric:'1 MIN', cue:'Push through your heels — drive up tall', prompt:'Keep the rhythm going!' },
      { name:'Wall Push-Up', emoji:'🤲', unit:'max reps', metric:'MAX REPS', cue:'Chest to wall — controlled down, strong up', prompt:'Every rep counts!' },
      { name:'Side Plank', emoji:'🧘', unit:'seconds', metric:'FOR TIME', cue:'Stack your hips — breathe steady', prompt:'Hold it — you are stronger than you think!' },
      { name:'Balance Walk', emoji:'👣', unit:'score /3', metric:'TECHNIQUE', cue:'Eyes forward — arms out wide', prompt:'Slow and steady — own every step' },
      { name:'Farmer Carry', emoji:'💼', unit:'metres', metric:'DISTANCE', cue:'Tall spine — shoulders packed back', prompt:'Walk it out — distance is yours' },
      { name:'Med Ball Throw', emoji:'🏐', unit:'metres', metric:'DISTANCE', cue:'Explode through your chest — follow through', prompt:'Put everything into it!' },
      { name:'Step-Up', emoji:'🪜', unit:'reps / 1 min', metric:'1 MIN', cue:'Drive the knee — stand tall at the top', prompt:'Strong legs — keep that pace!' },
      { name:'Bike Sprint', emoji:'🚴', unit:'cal / 30s', metric:'30s ALL OUT', cue:'Arms and legs — maximum effort', prompt:'30 seconds — give everything!' },
    ]
  },
  D: {
    name: 'Developmental',
    stations: [
      { name:'20m Sprint', emoji:'⚡', unit:'seconds', metric:'TIMED', cue:'Drive the arms — stay low out of the start', prompt:'Fastest time yet — go!' },
      { name:'Resisted Broad Jump', emoji:'🦘', unit:'metres', metric:'DISTANCE', cue:'Load the hips — explode forward', prompt:'Beat your last jump!' },
      { name:'AirBike Sprint', emoji:'🚴', unit:'calories', metric:'ALL OUT', cue:'Full body — arms pull, legs drive', prompt:'Max effort — no holding back!' },
      { name:'T-Test Agility', emoji:'📐', unit:'seconds', metric:'TIMED', cue:'Sharp cuts — stay low through each cone', prompt:'Faster than last time!' },
      { name:'Loaded CMJ', emoji:'🏋️', unit:'cm', metric:'HEIGHT', cue:'Counter-movement — explode at the top', prompt:'Jump higher — trust the load!' },
      { name:'Pull-Up', emoji:'💪', unit:'max reps', metric:'MAX REPS', cue:'Full hang — chin over bar each rep', prompt:'One more than last time!' },
      { name:'Rotational Med Ball', emoji:'🔄', unit:'metres', metric:'DISTANCE', cue:'Rotate from the hips — not the arms', prompt:'Both sides — note the difference!' },
      { name:'Pallof Hold', emoji:'🧘', unit:'seconds', metric:'FOR TIME', cue:'No rotation — resist the pull', prompt:'Stay locked — breathe through it!' },
      { name:'Reactive Catch', emoji:'⚡', unit:'score /10', metric:'SCORE', cue:'Stay light on your feet — eyes alert', prompt:'React faster — trust your instincts!' },
      { name:'Drop Jump', emoji:'🎯', unit:'score /3', metric:'TECHNIQUE', cue:'Land soft — stick it immediately', prompt:'Quiet landing — control is power!' },
    ]
  },
  P: {
    name: 'Performance',
    stations: [
      { name:'Sprint 20m', emoji:'⚡', unit:'seconds', metric:'TIMED', cue:'Maximum acceleration — drive hard for 20', prompt:'Benchmark set — beat it next week' },
      { name:'Force Plate CMJ', emoji:'📊', unit:'cm', metric:'HEIGHT + RSI', cue:'Full counter-movement — peak intent', prompt:'RSI and asymmetry tracked — focus on symmetry' },
      { name:'Rowing Erg', emoji:'🚣', unit:'W/kg', metric:'10s MAX', cue:'Full drive — legs, hips, arms in sequence', prompt:'Peak watts recorded — note the number' },
      { name:'Ski Erg', emoji:'🎿', unit:'W/kg', metric:'10s MAX', cue:'Lat engagement — full pull-through', prompt:'Upper body power output — push the watts' },
      { name:'Sled Sprint', emoji:'🏋️', unit:'seconds', metric:'10m TIMED', cue:'Horizontal force — low shin angle', prompt:'Force production — drive through the ground' },
      { name:'T-Test Gates', emoji:'📐', unit:'seconds', metric:'SPLIT TIMES', cue:'Sharp deceleration into each cone', prompt:'Split times logged — note the weakest direction' },
      { name:'RAST Test', emoji:'🏃', unit:'fatigue %', metric:'6×35m', cue:'Even pacing first 3 — all out last 3', prompt:'Fatigue index tracked — manage the drop-off' },
      { name:'Rotational Med Ball', emoji:'🔄', unit:'metres', metric:'ASYMMETRY', cue:'Dominant vs non-dominant — full rotation', prompt:'Asymmetry index calculated — aim for under 10%' },
      { name:'Pallof Load', emoji:'🧘', unit:'kg', metric:'PROGRESSIVE', cue:'Bilateral balance — resist rotation equally', prompt:'Load progression logged — note asymmetry' },
      { name:'Drop Jump RSI', emoji:'🎯', unit:'RSI', metric:'CONTACT TIME', cue:'Minimal contact time — maximum flight', prompt:'RSI recorded — contact time is the metric' },
    ]
  }
};

function getTier(id) { const f=String(id)[0]; return f==='2'?'D':f==='3'?'P':'F'; }
function getParam() { return new URLSearchParams(window.location.search).get('athlete'); }
function fmt(v) { if(v===null||isNaN(v))return'—'; return(v>=0?'+':'')+v.toFixed(1)+'%'; }
function parseVal(cell) { if(!cell||cell.v===null||cell.v===undefined)return null; const s=String(cell.v); if(s==='—'||s==='')return null; const n=parseFloat(s.replace(/[^0-9.-]/g,'')); return isNaN(n)?null:n; }
function parsePct(cell) { if(!cell)return null; const raw=cell.f||(cell.v!==null?String(cell.v):''); const clean=raw.replace(/[%+\s—]/g,''); if(!clean)return null; const n=parseFloat(clean); return isNaN(n)?null:n; }

async function load() {
  const athleteId = getParam();
  if (!athleteId) {
    document.getElementById('station-grid').innerHTML = '<div style="color:rgba(239,237,229,0.3);padding:40px;grid-column:1/-1;text-align:center;font-family:JetBrains Mono,monospace;font-size:12px;">Add ?athlete=101 to the URL</div>';
    return;
  }

  const tier = getTier(athleteId);
  const td = TIER_DATA[tier];
  document.getElementById('athlete-id').textContent = athleteId;
  document.getElementById('tier-name').textContent = td.name;

  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Board&headers=1`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(')+1, text.lastIndexOf(')')));
    const rows = json.table.rows;

    let targetRow = null;
    for (const row of rows) {
      const cells = row.c||[];
      if(!cells[1]||cells[1].v===null)continue;
      const id = String(cells[1].v).replace('.0','').trim();
      if(id===String(athleteId)){targetRow=cells;break;}
    }

    if(!targetRow){
      document.getElementById('station-grid').innerHTML='<div style="color:rgba(239,237,229,0.3);padding:40px;grid-column:1/-1;text-align:center;">Athlete not found</div>';
      return;
    }

    const wk1=[],wk2=[],deltas=[];
    for(let i=0;i<10;i++){
      wk1.push(parseVal(targetRow[2+i*3]));
      wk2.push(parseVal(targetRow[3+i*3]));
      deltas.push(parsePct(targetRow[4+i*3]));
    }

    const overall=parsePct(targetRow[32]);
    const week=wk2.some(v=>v!==null)?'Week 2+':'Week 1';
    document.getElementById('week-num').textContent=week;

    let bestIdx=-1,bestVal=-Infinity;
    deltas.forEach((d,i)=>{if(d!==null&&d>bestVal){bestVal=d;bestIdx=i;}});

    const prompts=['Great work!','Keep pushing!','You\'ve got this!','Outstanding effort!','Stay strong!','Brilliant!','Keep it up!','Give it everything!'];

    let grid='';
    const stations=td.stations;
    for(let i=0;i<stations.length;i++){
      const s=stations[i];
      const score=wk2[i]!==null?wk2[i]:wk1[i];
      const delta=deltas[i];
      const isBest=i===bestIdx&&bestVal>0;
      const hasSc=score!==null;
      const cls=hasSc?(isBest?'best':'filled'):'';
      const dotCls=hasSc?(isBest?'best':'filled'):'';
      const vsCls=delta===null?'nil':delta>0?'pos':'neg';

      grid+=`
        <div class="stn-box ${cls}">
          <div class="stn-top">
            <span class="stn-emoji">${s.emoji}</span>
            <span class="stn-num">S${i+1}</span>
            <div class="stn-dot ${dotCls}"></div>
          </div>
          <div class="stn-name">${s.name}</div>
          <div class="stn-metric">${s.metric}</div>
          <div class="stn-score ${hasSc?'':'empty'}">${hasSc?score:'—'}</div>
          <div class="stn-unit">${hasSc?s.unit:''}</div>
          ${delta!==null?`<div class="stn-vs ${vsCls}">${fmt(delta)} vs last time</div>`:''}
          <div class="stn-cue">${s.cue}</div>
          ${hasSc?`<div class="stn-prompt">${s.prompt}</div>`:''}
        </div>`;
    }

    document.getElementById('station-grid').innerHTML=grid;

    const ovEl=document.getElementById('overall-val');
    if(overall!==null){
      ovEl.textContent=fmt(overall);
      ovEl.className='overall-val '+(overall>0?'pos':overall<0?'neg':'nil');
    }

    document.getElementById('footer-time').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  } catch(e) {
    console.error(e);
  }
}

load();
setInterval(load,30000);
</script>
</body>
</html>
