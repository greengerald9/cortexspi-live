<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cortex SPI · Parent Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F2F0EC; min-height: 100vh; padding-bottom: 32px; }
  .header { background: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e5e0; position: sticky; top: 0; z-index: 10; }
  .wordmark { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #1a1a1a; }
  .wordmark span { color: #E8B84B; }
  .wordmark-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #bbb; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2px; }
  .live-pill { display: flex; align-items: center; gap: 5px; background: #edfbf3; border: 1px solid #a8e6c4; border-radius: 20px; padding: 4px 10px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #2E7D5B; animation: pulse 2s infinite; }
  .live-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #2E7D5B; text-transform: uppercase; letter-spacing: 0.1em; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .hero { padding: 24px 20px 16px; background: #fff; border-bottom: 1px solid #e8e5e0; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .hero-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 4px; }
  .hero-id { font-family: 'Oswald', sans-serif; font-size: 48px; font-weight: 700; line-height: 1; }
  .hero-id.F { color: #5FA8C9; } .hero-id.D { color: #2E7D5B; } .hero-id.P { color: #E8B84B; }
  .hero-programme { font-size: 12px; color: #888; margin-top: 4px; }
  .tier-pill { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; padding: 4px 12px; border-radius: 20px; align-self: flex-start; margin-top: 4px; }
  .tier-pill.F { background: rgba(95,168,201,0.1); border: 1px solid rgba(95,168,201,0.3); color: #5FA8C9; }
  .tier-pill.D { background: rgba(46,125,91,0.1); border: 1px solid rgba(46,125,91,0.3); color: #2E7D5B; }
  .tier-pill.P { background: rgba(232,184,75,0.1); border: 1px solid rgba(232,184,75,0.3); color: #E8B84B; }
  .overall-card { margin: 16px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
  .ov-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 6px; }
  .ov-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .ov-pct { font-family: 'Oswald', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; }
  .ov-pct.pos { color: #2E7D5B; } .ov-pct.neg { color: #E8543A; } .ov-pct.nil { color: #aaa; }
  .ov-sub { font-size: 12px; color: #aaa; margin-top: 6px; }
  .best-block { text-align: right; }
  .best-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #bbb; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .best-badge { background: #FFF8E8; border: 1px solid #E8B84B; border-radius: 10px; padding: 8px 12px; }
  .best-name { font-size: 11px; font-weight: 600; color: #1a1a1a; }
  .best-pct { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: #E8B84B; }
  .chart-card { margin: 0 16px 16px; background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
  .chart-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 14px; }
  .chart-wrap { display: flex; flex-direction: column; gap: 10px; }
  .chart-row { display: flex; align-items: center; gap: 10px; }
  .chart-label { font-size: 11px; color: #555; font-weight: 500; width: 80px; flex-shrink: 0; line-height: 1.3; }
  .chart-bar-wrap { flex: 1; }
  .chart-bar-track { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
  .chart-bar-fill.pos { background: linear-gradient(90deg, #2E7D5B, #39E07A); }
  .chart-bar-fill.neg { background: linear-gradient(90deg, #E8543A, #ff7a5a); }
  .chart-val { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; width: 46px; text-align: right; flex-shrink: 0; }
  .chart-val.pos { color: #2E7D5B; } .chart-val.neg { color: #E8543A; } .chart-val.nil { color: #E8B84B; }
  .journey-section { margin: 0 16px 16px; }
  .journey-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .journey-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.2em; }
  .journey-weeks { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #E8B84B; letter-spacing: 0.1em; }
  .spark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .spark-card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
  .spark-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
  .spark-emoji { font-size: 16px; }
  .spark-pb { font-family: 'JetBrains Mono', monospace; font-size: 7px; color: #E8B84B; letter-spacing: 0.08em; }
  .spark-name { font-size: 10px; font-weight: 600; color: #333; margin-bottom: 2px; line-height: 1.3; }
  .spark-val-row { display: flex; align-items: baseline; gap: 4px; margin-bottom: 4px; }
  .spark-val { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: #1a1a1a; line-height: 1; }
  .spark-unit { font-size: 9px; color: #aaa; }
  svg.sparkline { width: 100%; height: 28px; display: block; overflow: visible; }
  .spark-trend { font-family: 'JetBrains Mono', monospace; font-size: 8px; margin-top: 4px; letter-spacing: 0.04em; }
  .spark-trend.pos { color: #2E7D5B; } .spark-trend.neg { color: #E8543A; } .spark-trend.flat { color: #aaa; }
  .baseline-card { margin: 16px; background: #EDF7F1; border: 1px solid #a8e6c4; border-radius: 16px; padding: 24px 20px; text-align: center; }
  .baseline-emoji { font-size: 36px; margin-bottom: 10px; }
  .baseline-title { font-family: 'Oswald', sans-serif; font-size: 22px; text-transform: uppercase; color: #0F1E18; margin-bottom: 8px; }
  .baseline-sub { font-size: 13px; color: #555; line-height: 1.7; }
  .footer { padding: 20px; text-align: center; }
  .footer-text { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #ccc; text-transform: uppercase; letter-spacing: 0.1em; }
</style>
</head>
<body>

<div id="lockScreen" style="display:none;position:fixed;inset:0;background:#0F1E18;z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:32px;">
  <div style="font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#EFEDE5;letter-spacing:1px;margin-bottom:4px;">CORTE<span style="color:#E8B84B;">X</span> SPI</div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#7C877D;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:40px;">Athlete Access</div>
  <div style="width:100%;max-width:320px;">
    <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#7C877D;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px;">Access Code</div>
    <input id="codeInput" type="password" placeholder="Enter your code"
      style="width:100%;background:#1A2E22;border:1px solid #2E4A36;border-radius:8px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:15px;color:#EFEDE5;letter-spacing:0.15em;outline:none;margin-bottom:12px;"
      onkeydown="if(event.key==='Enter')checkCode()">
    <button onclick="checkCode()"
      style="width:100%;background:#E8B84B;border:none;border-radius:8px;padding:14px;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#0F1E18;cursor:pointer;">
      Unlock
    </button>
    <div id="codeError" style="display:none;font-family:'JetBrains Mono',monospace;font-size:10px;color:#E8543A;text-align:center;margin-top:10px;letter-spacing:0.1em;">Invalid access code</div>
  </div>
</div>

<div id="mainContent" style="display:none;">
  <div class="header">
    <div>
      <div class="wordmark">CORTE<span>X</span> SPI</div>
      <div class="wordmark-sub">Individual Athlete Development & Intelligence</div>
    </div>
    <div class="live-pill"><div class="live-dot"></div><span class="live-text">Live</span></div>
  </div>
  <div id="content">
    <div style="padding:60px 20px;text-align:center;color:#aaa;font-size:13px;">Loading your athlete...</div>
  </div>
  <div class="footer">
    <div class="footer-text">Cortex SPI · Individual Athlete Development & Intelligence · Private</div>
  </div>
</div>

<script>
const SHEET_ID = '19Ea_YOGRlh97lElsDbj6hDGgS-FSSDpvXErlYGYdvk0';
const ACCESS_CODES = { '108':'CX-108-F', '206':'CX-206-D', '308':'CX-308-P' };

const TIER_DATA = {
  F: {
    name:'Foundation', programme:'Individual Athlete Development & Intelligence',
    stations:[
      {name:'Sit-to-Stand',   emoji:'🪑', unit:'reps / 1 min',  higherIsBetter:true},
      {name:'Wall Push-Up',   emoji:'🤲', unit:'max reps',       higherIsBetter:true},
      {name:'Side Plank',     emoji:'🧘', unit:'seconds',        higherIsBetter:true},
      {name:'Balance Walk',   emoji:'👣', unit:'score /3',       higherIsBetter:true},
      {name:'Farmer Carry',   emoji:'💼', unit:'metres',         higherIsBetter:true},
      {name:'Med Ball Throw', emoji:'🏐', unit:'metres',         higherIsBetter:true},
      {name:'Step-Up',        emoji:'🪜', unit:'reps / 1 min',  higherIsBetter:true},
      {name:'Bike Sprint',    emoji:'🚴', unit:'cal / 30s',      higherIsBetter:true},
      null, null
    ]
  },
  D: {
    name:'Developmental', programme:'Individual Athlete Development & Intelligence',
    stations:[
      {name:'20m Sprint',          emoji:'⚡', unit:'seconds',    higherIsBetter:false},
      {name:'Resisted Broad Jump', emoji:'🦘', unit:'metres',     higherIsBetter:true},
      {name:'AirBike Sprint',      emoji:'🚴', unit:'calories',   higherIsBetter:true},
      {name:'T-Test',              emoji:'📐', unit:'seconds',    higherIsBetter:false},
      {name:'Loaded CMJ',          emoji:'🏋️', unit:'cm',        higherIsBetter:true},
      {name:'Pull-Up',             emoji:'💪', unit:'max reps',   higherIsBetter:true},
      {name:'Rotational Med Ball', emoji:'🔄', unit:'metres',     higherIsBetter:true},
      {name:'Pallof Hold',         emoji:'🧘', unit:'seconds',    higherIsBetter:true},
      {name:'Reactive Catch',      emoji:'⚡', unit:'score /10',  higherIsBetter:true},
      {name:'Drop Jump',           emoji:'🎯', unit:'score /3',   higherIsBetter:true}
    ]
  },
  P: {
    name:'Performance', programme:'Individual Athlete Development & Intelligence',
    stations:[
      {name:'Sprint 20m',          emoji:'⚡', unit:'seconds',    higherIsBetter:false},
      {name:'Force Plate CMJ',     emoji:'📊', unit:'cm',         higherIsBetter:true},
      {name:'Rowing Erg',          emoji:'🚣', unit:'W/kg',       higherIsBetter:true},
      {name:'Ski Erg',             emoji:'🎿', unit:'W/kg',       higherIsBetter:true},
      {name:'Sled Sprint',         emoji:'🏋️', unit:'seconds',   higherIsBetter:false},
      {name:'T-Test Gates',        emoji:'📐', unit:'seconds',    higherIsBetter:false},
      {name:'RAST',                emoji:'🏃', unit:'fatigue %',  higherIsBetter:false},
      {name:'Rotational Med Ball', emoji:'🔄', unit:'metres',     higherIsBetter:true},
      {name:'Pallof Load',         emoji:'🧘', unit:'kg',         higherIsBetter:true},
      {name:'Drop Jump RSI',       emoji:'🎯', unit:'RSI',        higherIsBetter:true}
    ]
  }
};

function getTier(id){const f=String(id)[0];return f==='2'?'D':f==='3'?'P':'F';}
function getAthleteId(){return new URLSearchParams(window.location.search).get('athlete')||'';}
function fmt(v){if(v===null||isNaN(v))return'—';return(v>=0?'+':'')+v.toFixed(1)+'%';}
function parseVal(c){if(!c||c.v===null||c.v===undefined)return null;const s=String(c.v);if(s==='—'||s==='')return null;const n=parseFloat(s.replace(/[^0-9.-]/g,''));return isNaN(n)?null:n;}
function parsePct(c){if(!c)return null;const r=c.f||(c.v!==null?String(c.v):'');const cl=r.replace(/[%+\s—]/g,'');if(!cl)return null;const n=parseFloat(cl);return isNaN(n)?null:n;}

function checkCode(){
  const id=getAthleteId();
  const entered=document.getElementById('codeInput').value.trim().toUpperCase();
  const correct=(ACCESS_CODES[id]||'').toUpperCase();
  if(entered===correct){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('mainContent').style.display='block';
    try{localStorage.setItem('cx_auth_'+id,'1');}catch(e){}
  } else {
    document.getElementById('codeError').style.display='block';
    document.getElementById('codeInput').value='';
    document.getElementById('codeInput').focus();
  }
}

(function(){
  const id=getAthleteId();
  if(!id){document.getElementById('mainContent').style.display='block';return;}
  let ok=false;
  try{ok=localStorage.getItem('cx_auth_'+id)==='1';}catch(e){}
  if(ok){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('mainContent').style.display='block';
  } else {
    document.getElementById('lockScreen').style.display='flex';
  }
})();

function sparkSVG(vals,higherIsBetter){
  const W=180,H=28,P=4;
  const clean=vals.filter(v=>v!==null&&v!==undefined&&!isNaN(v));
  if(clean.length<2)return`<svg class="sparkline" viewBox="0 0 ${W} ${H}"><line x1="${P}" y1="${H/2}" x2="${W-P}" y2="${H/2}" stroke="#f0f0f0" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`;
  const mn=Math.min(...clean),mx=Math.max(...clean),rng=mx-mn||1;
  const pts=clean.map((v,i)=>{const x=P+(i/(clean.length-1))*(W-P*2);const y=P+(1-(v-mn)/rng)*(H-P*2);return[x.toFixed(1),y.toFixed(1)];});
  const poly=pts.map(p=>p.join(',')).join(' ');
  const last=pts[pts.length-1];
  const improved=higherIsBetter?clean[clean.length-1]>=clean[0]:clean[clean.length-1]<=clean[0];
  const lc=improved?'#2E7D5B':'#E8543A';
  const area=`${pts[0][0]},${H-P} ${poly} ${last[0]},${H-P}`;
  return`<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polygon points="${area}" fill="${improved?'rgba(46,125,91,0.1)':'rgba(232,84,58,0.08)'}"/>
    <polyline points="${poly}" fill="none" stroke="${lc}" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#E8B84B"/>
  </svg>`;
}

// Form Responses 1: Timestamp(0), Station(1), Athlete I.D(2), Week(3), Score(4), COACH(5), Column1-key(6)
async function loadSparklines(athleteId){
  const tier=getTier(athleteId),td=TIER_DATA[tier];
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Form%20Responses%201&headers=1`;
    const text=await(await fetch(url)).text();
    const json=JSON.parse(text.substring(text.indexOf('(')+1,text.lastIndexOf(')')));
    const allRows=(json.table.rows||[]).filter(r=>r.c&&r.c[2]&&r.c[2].v!==null);

    // Filter by Athlete I.D (col 2)
    const athleteRows=allRows.filter(r=>{
      return String(r.c[2].v).replace('.0','').trim()===String(athleteId);
    });

    // Sort by Week (col 3) asc, then timestamp (col 0)
    athleteRows.sort((a,b)=>{
      const wa=parseFloat(String(a.c[3]?.v||'0'))||0;
      const wb=parseFloat(String(b.c[3]?.v||'0'))||0;
      return wa!==wb?wa-wb:String(a.c[0]?.v||'').localeCompare(String(b.c[0]?.v||''));
    });

    const weeks=[...new Set(athleteRows.map(r=>String(r.c[3]?.v||'').trim()).filter(w=>w))];

    // Per station: match by name (col 1), extract score (col 4)
    const stationHistory=td.stations.map(s=>{
      if(!s)return null;
      return athleteRows
        .filter(r=>String(r.c[1]?.v||'').trim().toLowerCase()===s.name.toLowerCase())
        .map(r=>parseVal(r.c[4]))
        .filter(v=>v!==null);
    });

    return{stationHistory,weekCount:weeks.length};
  }catch(e){
    console.error('Form Responses 1 fetch error:',e);
    return{stationHistory:null,weekCount:0};
  }
}

function render(athleteId,wk1,wk2,deltas,overall,stationHistory,weekCount){
  const tier=getTier(athleteId),td=TIER_DATA[tier];
  const hasComparison=overall!==null&&wk2.some(v=>v!==null);
  const hasBaseline=wk1.some(v=>v!==null);
  let bestIdx=-1,bestVal=-Infinity;
  deltas.forEach((d,i)=>{if(d!==null&&d>bestVal){bestVal=d;bestIdx=i;}});
  const maxAbs=Math.max(...deltas.filter(d=>d!==null).map(d=>Math.abs(d)),1);
  const weekLabel=weekCount>1?`${weekCount} sessions logged`:weekCount===1?'1 session logged':'Baseline → Latest';

  let html=`<div class="hero"><div class="hero-top"><div><div class="hero-label">Athlete</div><div class="hero-id ${tier}">${athleteId}</div><div class="hero-programme">${td.programme}</div></div><div class="tier-pill ${tier}">${td.name}</div></div></div>`;

  if(hasComparison){
    const oc=overall>0?'pos':overall<0?'neg':'nil';
    html+=`<div class="overall-card"><div class="ov-label">Overall — vs last session</div><div class="ov-row"><div><div class="ov-pct ${oc}">${fmt(overall)}</div><div class="ov-sub">across all stations</div></div>${bestIdx>=0&&td.stations[bestIdx]?`<div class="best-block"><div class="best-label">Best station</div><div class="best-badge"><div class="best-name">${td.stations[bestIdx].name}</div><div class="best-pct">${fmt(bestVal)}</div></div></div>`:''}</div></div>`;
    html+=`<div class="chart-card"><div class="chart-title">Improvement % — vs last session</div><div class="chart-wrap">`;
    td.stations.filter(s=>s!==null).forEach((s,i)=>{const d=deltas[i];const c=d===null?'nil':d>0?'pos':'neg';html+=`<div class="chart-row"><div class="chart-label">${s.emoji} ${s.name}</div><div class="chart-bar-wrap"><div class="chart-bar-track"><div class="chart-bar-fill ${c}" style="width:${d!==null?Math.abs(d)/maxAbs*100:0}%"></div></div></div><div class="chart-val ${c}">${fmt(d)}</div></div>`;});
    html+=`</div></div>`;
  }else if(hasBaseline){
    html+=`<div class="baseline-card"><div class="baseline-emoji">✅</div><div class="baseline-title">Baseline Recorded</div><div class="baseline-sub">First session scores are in. Check back after the next session to see improvements.</div></div>`;
  }else{
    html+=`<div class="baseline-card"><div class="baseline-emoji">🏃</div><div class="baseline-title">Session Incoming</div><div class="baseline-sub">Scores will appear here after the first session.</div></div>`;
  }

  // Journey So Far — from Form Responses 1
  const active=td.stations.map((s,i)=>({s,i})).filter(({s})=>s!==null);
  const hasHistory=stationHistory&&active.some(({i})=>stationHistory[i]&&stationHistory[i].length>0);

  if(hasHistory){
    html+=`<div class="journey-section"><div class="journey-header"><div class="journey-title">The Journey So Far</div><div class="journey-weeks">${weekLabel}</div></div><div class="spark-grid">`;
    active.forEach(({s,i})=>{
      const hist=(stationHistory&&stationHistory[i])||[];
      // Fallback to Board wk1/wk2 if no form data for this station
      const sparkData=hist.length>0?hist:[wk1[i],wk2[i]].filter(v=>v!==null);
      const cur=sparkData.length>0?sparkData[sparkData.length-1]:null;
      const first=sparkData.length>0?sparkData[0]:null;
      const diff=sparkData.length>1&&cur!==null&&first!==null?parseFloat((cur-first).toFixed(2)):null;
      const imp=diff!==null?(s.higherIsBetter?diff>0:diff<0):null;
      const tc=imp===null?'flat':imp?'pos':'neg';
      const pb=sparkData.length>0?(s.higherIsBetter?Math.max(...sparkData):Math.min(...sparkData)):null;
      const isPB=cur!==null&&cur===pb&&sparkData.length>1;
      const trendLabel=diff!==null?(diff>0?`↑ +${Math.abs(diff)} from start`:diff<0?`↓ ${Math.abs(diff)} from start`:'→ No change'):sparkData.length===1?'Session 1 baseline':'—';
      html+=`<div class="spark-card"><div class="spark-top"><span class="spark-emoji">${s.emoji}</span>${isPB?'<div class="spark-pb">● PB</div>':''}</div><div class="spark-name">${s.name}</div><div class="spark-val-row"><div class="spark-val">${cur!==null?cur:'—'}</div><div class="spark-unit">${cur!==null?s.unit:''}</div></div>${sparkSVG(sparkData,s.higherIsBetter)}<div class="spark-trend ${tc}">${trendLabel}</div></div>`;
    });
    html+=`</div></div>`;
  }

  document.getElementById('content').innerHTML=html;
}

async function load(){
  const athleteId=getAthleteId();
  if(!athleteId){document.getElementById('content').innerHTML='<div style="padding:60px 20px;text-align:center;color:#aaa;font-size:13px;">No athlete ID in link.</div>';return;}
  try{
    const boardUrl=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Board&headers=1`;
    const boardText=await(await fetch(boardUrl)).text();
    const boardJson=JSON.parse(boardText.substring(boardText.indexOf('(')+1,boardText.lastIndexOf(')')));
    let row=null;
    for(const r of boardJson.table.rows){const c=r.c||[];if(!c[1]||c[1].v===null)continue;if(String(c[1].v).replace('.0','').trim()===String(athleteId)){row=c;break;}}
    const wk1=[],wk2=[],deltas=[];
    for(let i=0;i<10;i++){wk1.push(row?parseVal(row[2+i*3]):null);wk2.push(row?parseVal(row[3+i*3]):null);deltas.push(row?parsePct(row[4+i*3]):null);}
    const overall=row?parsePct(row[32]):null;
    const{stationHistory,weekCount}=await loadSparklines(athleteId);
    render(athleteId,wk1,wk2,deltas,overall,stationHistory,weekCount);
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML='<div style="padding:60px 20px;text-align:center;color:#aaa;">Connection error — retrying in 30 seconds</div>';
  }
}

load();
setInterval(load,30000);
</script>
